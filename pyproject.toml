[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nhl-legacy-editor"
version = "0.2.0"
description = "Starter tooling for inspecting NHL Legacy Xbox 360 roster saves on PC."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0,<4",
]

[project.scripts]
nhl-legacy-editor = "nhl_legacy_editor.cli:main"
nhl-legacy-desktop = "nhl_legacy_editor.desktop_app:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["nhl_legacy_editor"]

[tool.setuptools.package-data]
nhl_legacy_editor = ["templates/*.html"]
